name: Bug
description: An automation does something wrong.
labels: [bug]
body:
  - type: input
    id: automation
    attributes:
      label: Automation
      placeholder: autodeploy-downstream
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, or the `version` field of a log record.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log records at `LOG_LEVEL=debug`. Remove anything private first.
      render: json
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The config file, with private values removed.
      render: yaml
