query PullRequests(
  $owner: String!
  $name: String!
  $first: Int!
  $after: String
  $states: [PullRequestState!]
  $base: String
  $labels: [String!]
  $files: Boolean!
) {
  repository(owner: $owner, name: $name) {
    pullRequests(
      first: $first
      after: $after
      states: $states
      baseRefName: $base
      labels: $labels
      orderBy: {field: UPDATED_AT, direction: DESC}
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        createdAt
        updatedAt
        mergedAt
        additions
        deletions
        author {
          __typename
          login
          avatarUrl
          ... on User {
            name
          }
        }
        files(first: 100) @include(if: $files) {
          nodes {
            path
          }
        }
      }
    }
  }
}
