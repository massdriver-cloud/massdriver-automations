query ScorecardAlarms($org: ID!, $instance: ID!, $cursor: Cursor) {
  instanceAlarms(organizationId: $org, filter: { instanceId: { eq: $instance } }, cursor: $cursor) {
    cursor {
      next
    }
    items {
      id
      displayName
      currentState {
        status
        occurredAt
      }
    }
  }
}
