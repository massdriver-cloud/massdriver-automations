query StatusPageStashEntries($organizationId: ID!, $scopes: [AlphaStashScope!]!, $filter: AlphaStashEntriesFilter, $cursor: Cursor) {
  alphaStashEntriesForScopes(organizationId: $organizationId, scopes: $scopes, filter: $filter, cursor: $cursor) {
    cursor {
      next
    }
    items {
      scope {
        kind
        id
      }
      key
      value
      expiresAt
      updatedAt
    }
  }
}
