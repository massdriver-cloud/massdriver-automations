name: status-page
version: 0.1.0
label: Status Page
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-automations/main/examples/resource-types/status-page/icon.svg

ui:
  connectionOrientation: link

schema:
  title: Status Page
  description: >-
    A public status page and its machine-readable endpoints. Link it to a bundle that shows the page, checks it, or
    publishes its status somewhere else.
  type: object
  additionalProperties: false
  required:
    - url
    - status_json_url
    - pages
  examples:
    - url: https://status.acme.com
      status_json_url: https://status.acme.com/api/status.json
      pages:
        - title: Acme
          slug: acme
          url: https://status.acme.com/acme/
          feed_url: https://status.acme.com/acme/feed.atom
          badge_url: https://status.acme.com/acme/badge.svg
  properties:
    url:
      title: URL
      description: The status site. Its first page is also served here.
      type: string
      pattern: ^https?://[^\s/]+$
    status_json_url:
      title: Status JSON URL
      description: Status, components, uptime, incidents, and scheduled maintenance of every page, as JSON.
      type: string
      pattern: ^https?://\S+$
    pages:
      title: Pages
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - title
          - slug
          - url
          - feed_url
          - badge_url
        properties:
          title:
            title: Title
            type: string
          slug:
            title: Slug
            type: string
            pattern: ^[a-z0-9][a-z0-9-]*$
          url:
            title: URL
            type: string
            pattern: ^https?://\S+$
          feed_url:
            title: Atom feed URL
            description: The incidents of the page.
            type: string
            pattern: ^https?://\S+$
          badge_url:
            title: Badge URL
            description: An SVG badge of the page's status.
            type: string
            pattern: ^https?://\S+$
