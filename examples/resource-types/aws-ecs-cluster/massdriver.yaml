name: aws-ecs-cluster
version: 0.1.0
label: AWS ECS Cluster

ui:
  connectionOrientation: link
  environmentDefaultGroup: compute

schema:
  title: AWS ECS Cluster
  description: >-
    A Fargate cluster, the load balancer its services share, and the VPC and DNS zone both sit in.
    A service runs in the cluster's VPC and adds a rule for its own subdomain to the listener.
  type: object
  additionalProperties: false
  required:
    - name
    - arn
    - region
    - load_balancer
    - network
  properties:
    name:
      title: Cluster Name
      type: string
      minLength: 1
    arn:
      title: Cluster ARN
      type: string
      minLength: 1
    region:
      title: Region
      type: string
      minLength: 1
    load_balancer:
      title: Load Balancer
      type: object
      additionalProperties: false
      required:
        - arn
        - dns_name
        - zone_id
        - security_group_id
        - listener_arn
      properties:
        arn:
          title: ARN
          type: string
        dns_name:
          title: DNS Name
          type: string
        zone_id:
          title: Hosted Zone ID
          description: The load balancer's own zone, for alias records.
          type: string
        security_group_id:
          title: Security Group ID
          description: Services allow traffic from this group to their container port.
          type: string
        listener_arn:
          title: Listener ARN
          description: HTTPS when the cluster has a DNS zone, otherwise HTTP. Services add rules here.
          type: string
        protocol:
          title: Listener Protocol
          type: string
          enum:
            - HTTP
            - HTTPS
    network:
      title: Network
      description: The VPC the load balancer is in. Services run in its private subnets.
      type: object
      additionalProperties: false
      required:
        - id
        - private_subnet_ids
        - internet_egress
      properties:
        id:
          title: VPC ID
          type: string
          pattern: ^vpc-[a-f0-9]+$
        private_subnet_ids:
          title: Private Subnet IDs
          type: array
          minItems: 1
          items:
            type: string
        internet_egress:
          title: Internet Egress
          description: Whether the private subnets can reach the internet, e.g. to pull public images.
          type: boolean
    zone:
      title: DNS Zone
      description: Present when the listener is HTTPS. Services put their subdomains here; the listener's certificate covers them.
      type: object
      additionalProperties: false
      required:
        - zone_id
        - domain
      properties:
        zone_id:
          title: Hosted Zone ID
          type: string
          pattern: ^Z[A-Z0-9]+$
        domain:
          title: Domain
          type: string
