# A live Postgres migration on the billing-dev canvas, with no cloud access. In the billing project,
# billing-dev-claims and billing-dev-ledger both connect to billing-dev-app, so each one's md/traffic draws the
# line to the app. billing-dev-claims plays the old database and billing-dev-ledger the new one.
mode: simulate
# A write every 5 seconds. Entries expire after 15 seconds once the simulator stops.
interval: 5s
simulate:
  scenario: postgres-cutover
  # The whole story in 3 minutes, then again from the start.
  duration: 3m
  loop: true
  roles:
    environment: billing-dev
    old_database: billing-dev-claims
    new_database: billing-dev-ledger
    # The lag that the new database starts with, in seconds. Its usage bar counts down from here.
    max_lag: 120
    # Healthy traffic and usage while the databases move.
    instances: [billing-dev-app]
