name: massdriver-sandbox-on-join
description: Forks a template environment for each person who joins a group, and removes it when they leave. Runs on a
  Kubernetes cluster, with an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-sandbox-on-join
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - config
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - host
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served, such as `sandbox-on-join.automations.acme.com`. Point it at the
            ingress controller. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        class_name:
          type: string
          title: Ingress class
          description: Empty uses the default class of the cluster.
        cluster_issuer:
          type: string
          title: cert-manager ClusterIssuer
          description: Issues a certificate for the host. Leave empty when TLS ends in front of the ingress controller,
            or when you set a TLS secret.
        tls_secret_name:
          type: string
          title: TLS secret
          description: A Secret in the namespace with a certificate for the host. Ignored when a ClusterIssuer is set.
    config:
      type: object
      title: Settings
      required:
      - sandboxes
      properties:
        sandboxes:
          type: array
          title: Rules
          items:
            type: object
            title: Rule
            required:
            - group
            - project
            - environment
            properties:
              group:
                type: string
                title: Group
                description: Each person who joins it gets a sandbox.
                $md.list:
                  resource: group
              project:
                type: string
                title: Project
                description: The project of the template. Forks go into the same project.
                $md.list:
                  resource: project
              environment:
                type: string
                title: Template environment
              deploy:
                type: boolean
                title: Deploy the fork after it is created
                default: false
              deleteAfterDecommission:
                type: boolean
                title: Delete the fork after its decommission, when the person leaves
                default: false
              copyEnvironmentDefaults:
                type: boolean
                title: Copy the template's environment defaults
                default: false
              copySecrets:
                type: boolean
                title: Copy the secrets of the template's instances
                default: false
              copyRemoteReferences:
                type: boolean
                title: Copy the template's remote references
                default: false
          minItems: 1
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  kubernetes_cluster:
    resource_type: massdriver-kubernetes-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - config
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - class_name
    - cluster_issuer
    - tls_secret_name
  config:
    sandboxes:
      ui:options:
        itemTitle: '{{project}}-{{environment}}'
      items:
        ui:order:
        - group
        - project
        - environment
        - deploy
        - deleteAfterDecommission
        - copyEnvironmentDefaults
        - copySecrets
        - copyRemoteReferences
