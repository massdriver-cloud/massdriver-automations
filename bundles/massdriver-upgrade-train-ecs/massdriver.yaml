name: massdriver-upgrade-train-ecs
description: Moves each new bundle version through stages of instances, such as dev, staging, and prod, with a soak time
  and an alarm check between stages. Set the `UPGRADE_TRAIN_TOKEN` secret to start, resume, and stop runs with `POST https://<host>/upgrade-train/run`
  and `/halt`. Runs on Amazon ECS with Fargate, with an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-upgrade-train-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - logs
  - config
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code. A deploy of
            a tag that moves, such as `latest` or `0.2`, restarts the automation on the image the tag names then.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `upgrade-train.<domain of the cluster's hosted zone>`.
            The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      required:
      - trains
      properties:
        slack:
          type: object
          title: Slack
          properties:
            channel:
              type: string
              title: Channel
              description: The channel for trains that do not name their own. Empty writes posts to the logs only.
              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
              message:
                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
        trains:
          type: array
          title: Trains
          items:
            type: object
            title: Train
            required:
            - name
            - bundles
            - stages
            properties:
              name:
                type: string
                title: Name
                description: Unique. Posts, deployment messages, and `POST /upgrade-train/run?train=<name>` use it.
                pattern: ^[a-z0-9][a-z0-9-]*$
                message:
                  pattern: Must be lowercase letters, numbers, and hyphens.
              bundles:
                type: array
                title: Bundles
                description: The bundles whose new versions ride this train. Each bundle runs on its own.
                items:
                  type: string
                  title: Bundle
                  examples:
                  - aws-aurora-postgres
                uniqueItems: true
                minItems: 1
              include_development:
                type: boolean
                title: Include development versions
                description: Also run versions such as `1.3.1-dev.20261124T055403Z`.
                default: false
              stages:
                type: array
                title: Stages
                description: Run in order.
                items:
                  type: object
                  title: Stage
                  required:
                  - name
                  - match
                  - mode
                  properties:
                    name:
                      type: string
                      title: Name
                      description: Unique in the train.
                      pattern: ^[a-z0-9][a-z0-9-]*$
                      message:
                        pattern: Must be lowercase letters, numbers, and hyphens.
                    match:
                      type: object
                      title: Instance attributes
                      description: Effective attributes of the instances in this stage. Separate values with commas to
                        match any of them, such as `api, web`.
                      default: {}
                      additionalProperties:
                        type: string
                    mode:
                      type: string
                      title: Mode
                      oneOf:
                      - const: deploy
                        title: Deploy now
                      - const: propose
                        title: Propose a deployment for a person to approve
                      default: propose
                    soak:
                      type: string
                      title: Soak
                      description: How long the stage waits after its deployments complete, with no firing alarms, before
                        the next stage starts.
                      default: 1h
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                      message:
                        pattern: Must be a duration, such as 90s, 10m, or 1h30m.
                minItems: 1
              slack:
                type: object
                title: Slack
                properties:
                  channel:
                    type: string
                    title: Channel
                    description: Replaces the default channel for this train.
                    pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                    message:
                      pattern: 'Must be a channel name, such as #infra, or a channel ID.'
          minItems: 1
        massdriver:
          type: object
          title: Massdriver UI
          properties:
            app_url:
              type: string
              title: App URL
              description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
              pattern: ^https?://[^\s]+$
              message:
                pattern: Must be a URL.
        results:
          type: object
          title: Stash results
          properties:
            prefix:
              type: string
              title: Key prefix
              description: The start of the stash keys of the results the automation writes. The server accepts `md/v1`
                keys once its widget catalog has them. Until then, a prefix outside `md/`, such as `results/v1`, shows
                each result as a labeled row.
              default: md/v1
              pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
              message:
                pattern: Must be letters, digits, and `_ . -`, in parts separated by `/`, such as results/v1.
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    SLACK_BOT_TOKEN:
      title: Slack bot token
      description: The `xoxb-` token of the Slack app. Posts go to the channels in the settings.
    SLACK_WEBHOOK_URL:
      title: Slack webhook URL
      description: An incoming webhook, for a workspace without the Slack app. Every post goes to its one channel. Ignored
        when the bot token is set.
    UPGRADE_TRAIN_TOKEN:
      title: Run token
      description: 'Callers of `POST /upgrade-train/run` and `POST /upgrade-train/halt` send it as `Authorization: Bearer
        <token>`.'
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    ui:order:
    - slack
    - trains
    - massdriver
    - results
    trains:
      ui:options:
        itemTitle: '{{name}}'
      items:
        ui:order:
        - name
        - bundles
        - include_development
        - stages
        - slack
        bundles:
          ui:field: tagInput
        stages:
          ui:options:
            itemTitle: '{{name}}'
          items:
            ui:order:
            - name
            - match
            - mode
            - soak
