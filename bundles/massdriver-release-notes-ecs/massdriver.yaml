name: massdriver-release-notes-ecs
description: Posts each new bundle version, and the instances that can upgrade, to Slack or Microsoft Teams. Runs on Amazon
  ECS with Fargate, with an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-release-notes-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - logs
  - config
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.1.0`. Pin a version so that a redeploy runs the same code.
          default: '0.1'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `release-notes.<domain of the cluster's hosted zone>`.
            The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      properties:
        slack:
          type: object
          title: Slack
          properties:
            channel:
              type: string
              title: Channel
              description: The channel for release notes. Empty posts nothing to Slack.
              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
              message:
                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
        teams:
          type: object
          title: Microsoft Teams
          properties:
            enabled:
              type: boolean
              title: Post to Teams
              description: Posts an Adaptive Card to the webhook in the `TEAMS_WEBHOOK_URL` secret.
              default: false
        include_development:
          type: boolean
          title: Include development versions
          description: Also post versions such as `1.3.1-dev.20261124T055403Z`.
          default: false
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    SLACK_BOT_TOKEN:
      title: Slack bot token
      description: The `xoxb-` token of the Slack app. Posts go to the channels in the settings.
    SLACK_WEBHOOK_URL:
      title: Slack webhook URL
      description: An incoming webhook, for a workspace without the Slack app. Every post goes to its one channel. Ignored
        when the bot token is set.
    TEAMS_WEBHOOK_URL:
      title: Teams webhook URL
      description: A Microsoft Teams Workflows webhook, for `teams.enabled`.
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    ui:order:
    - slack
    - teams
    - include_development
