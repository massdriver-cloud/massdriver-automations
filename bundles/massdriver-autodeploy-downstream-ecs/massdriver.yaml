name: massdriver-autodeploy-downstream-ecs
description: Deploys the dependents of an instance after it deploys. Each rule selects dependents by their attributes.
  The first rule that matches a dependent applies. Runs on Amazon ECS with Fargate, with an event destination that sends
  it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-autodeploy-downstream-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  examples:
  - __name: Development
    image:
      repository: ghcr.io/massdriver-cloud/massdriver-automations
      tag: '0.2'
    ingress:
      dns_records: true
    logs:
      retention_days: 7
  - __name: Production
    image:
      repository: ghcr.io/massdriver-cloud/massdriver-automations
      tag: '0.2'
    ingress:
      dns_records: true
    logs:
      retention_days: 365
  required:
  - image
  - ingress
  - logs
  - config
  - attributes
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code. A deploy of
            a tag that moves, such as `latest` or `0.2`, restarts the automation on the image the tag names then.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `autodeploy-downstream.<domain of the cluster's hosted
            zone>`. The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      properties:
        rules:
          type: array
          title: Rules
          items:
            type: object
            title: Rule
            required:
            - name
            - downstream
            - action
            properties:
              name:
                type: string
                title: Name
                description: Unique. The logs and the deployment message name the rule.
                pattern: ^[a-z0-9][a-z0-9-]*$
                message:
                  pattern: Must be lowercase letters, numbers, and hyphens.
              downstream:
                type: object
                title: Dependent attributes
                description: Attributes that a dependent must have to deploy, such as `autodeploy` = `true`. Separate
                  values with commas to match any of them, such as `api, web`.
                default: {}
                additionalProperties:
                  type: string
              upstream:
                type: object
                title: Upstream attributes
                description: Attributes that the instance that deployed must have. Empty matches every instance. Separate
                  values with commas to match any of them, such as `api, web`.
                default: {}
                additionalProperties:
                  type: string
              action:
                type: string
                title: Action
                oneOf:
                - const: deploy
                  title: Deploy now
                - const: propose
                  title: Propose a deployment for a person to approve
                default: deploy
          minItems: 1
          default:
          - name: autodeploy
            downstream:
              autodeploy: 'true'
            upstream: {}
            action: deploy
        results:
          type: object
          title: Stash results
          properties:
            prefix:
              type: string
              title: Key prefix
              description: The start of the stash keys of the results the automation writes. The server accepts `md/v1`
                keys once its widget catalog has them. Until then, a prefix outside `md/`, such as `results/v1`, shows
                each result as a labeled row.
              default: md/v1
              pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
              message:
                pattern: Must be letters, digits, and `_ . -`, in parts separated by `/`, such as results/v1.
    attributes:
      type: object
      title: Event attributes
      description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends events
        of any attributes.
      default: {}
      additionalProperties:
        type: string
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - attributes
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    rules:
      ui:options:
        itemTitle: '{{name}}'
      items:
        ui:order:
        - name
        - action
        - downstream
        - upstream
        action:
          ui:widget: radio
  attributes:
    ui:options:
      addButtonText: Add attribute
