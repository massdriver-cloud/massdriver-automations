name: massdriver-github-deployments
description: Shows Massdriver deployments as GitHub Deployments on the repository that an instance names. Set the `GITHUB_TOKEN`
  secret. Runs on a Kubernetes cluster, with an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-github-deployments
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - config
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.1.0`. Pin a version so that a redeploy runs the same code.
          default: '0.1'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - host
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served, such as `github-deployments.automations.acme.com`. Point it at
            the ingress controller. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        class_name:
          type: string
          title: Ingress class
          description: Empty uses the default class of the cluster.
        cluster_issuer:
          type: string
          title: cert-manager ClusterIssuer
          description: Issues a certificate for the host. Leave empty when TLS ends in front of the ingress controller,
            or when you set a TLS secret.
        tls_secret_name:
          type: string
          title: TLS secret
          description: A Secret in the namespace with a certificate for the host. Ignored when a ClusterIssuer is set.
    config:
      type: object
      title: Settings
      properties:
        github:
          type: object
          title: GitHub
          properties:
            repo_attribute:
              type: string
              title: Repository attribute
              description: The instance attribute that names the repository, as `owner/name`.
              default: github_repo
            ref_attribute:
              type: string
              title: Ref attribute
              description: The instance attribute that names the ref. Without it, the deployment uses the default branch.
              default: github_ref
            environment_name:
              type: string
              title: GitHub environment
              oneOf:
              - const: environment
                title: The environment, such as prod
              - const: project-environment
                title: The project and environment, such as api-prod
              default: environment
            api_url:
              type: string
              title: API URL
              description: 'For GitHub Enterprise Server: `https://<host>/api/v3`.'
              default: https://api.github.com
              pattern: ^https?://[^\s]+$
              message:
                pattern: Must be a URL.
        massdriver:
          type: object
          title: Massdriver UI
          properties:
            app_url:
              type: string
              title: App URL
              description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
              pattern: ^https?://[^\s]+$
              message:
                pattern: Must be a URL.
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  kubernetes_cluster:
    resource_type: massdriver-kubernetes-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    GITHUB_TOKEN:
      title: GitHub token
      description: Needs `Deployments` write and `Metadata` read, or the `repo_deployment` scope.
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - config
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - class_name
    - cluster_issuer
    - tls_secret_name
  config:
    github:
      ui:order:
      - repo_attribute
      - ref_attribute
      - environment_name
      - api_url
