name: massdriver-chaos-monkey-ecs
description: Picks matching instances at random on a schedule and sends them deployments of presets, merged presets, mutated
  params, and gibberish, then posts how each one went. Set the `CHAOS_MONKEY_RUN_TOKEN` secret to start runs with `POST
  https://<host>/chaos-monkey/run`. Runs on Amazon ECS with Fargate, with an event destination that sends it only the
  events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-chaos-monkey-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - logs
  - config
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code. A deploy of
            a tag that moves, such as `latest` or `0.2`, restarts the automation on the image the tag names then.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `chaos-monkey.<domain of the cluster's hosted zone>`.
            The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      required:
      - match
      - mode
      properties:
        match:
          type: object
          title: Instance attributes
          description: Effective attributes of the instances to target. Match only instances you can rebuild. Separate
            values with commas to match any of them, such as `api, web`.
          default: {}
          additionalProperties:
            type: string
        mode:
          type: string
          title: Mode
          oneOf:
          - const: propose
            title: Propose deployments for a person to approve
          - const: plan
            title: Plan deployments, which change nothing
          - const: deploy
            title: Deploy now
          default: propose
        schedule:
          type: string
          title: Schedule
          description: Standard cron (minute, hour, day of month, month, day of week), or `@hourly`, `@every 30m`. Empty
            runs only from `POST /chaos-monkey/run`.
          examples:
          - '@every 30m'
        timezone:
          type: string
          title: Time zone
          description: The time zone of the schedule.
          default: UTC
          examples:
          - America/New_York
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
          message:
            pattern: Must be an IANA time zone, such as America/New_York or UTC.
        status:
          type: array
          title: Instance statuses
          items:
            type: string
            enum:
            - INITIALIZED
            - PROVISIONED
            - FAILED
            - DECOMMISSIONED
          uniqueItems: true
          minItems: 1
          default:
          - PROVISIONED
        instances:
          type: integer
          title: Instances per run
          default: 1
          minimum: 1
          maximum: 50
        strategies:
          type: object
          title: Strategy weights
          description: How often each strategy is picked. 0 turns one off.
          properties:
            preset:
              type: integer
              title: Preset
              description: One preset over the instance's params.
              default: 1
              minimum: 0
            merge:
              type: integer
              title: Merge
              description: Two or more presets merged together.
              default: 1
              minimum: 0
            mutate:
              type: integer
              title: Mutate
              description: Random fields set to new values from their schema.
              default: 1
              minimum: 0
            gibberish:
              type: integer
              title: Gibberish
              description: Random fields set to nonsense.
              default: 1
              minimum: 0
        mutate:
          type: object
          title: Mutate
          properties:
            rate:
              type: number
              title: Rate
              description: The chance that each field changes.
              default: 0.3
              minimum: 0.01
              maximum: 1
        gibberish:
          type: object
          title: Gibberish
          properties:
            max_fields:
              type: integer
              title: Most fields
              description: The most fields that one run garbles.
              default: 3
              minimum: 1
              maximum: 50
        sign_off:
          type: boolean
          title: Sign off
          description: Ends each deployment message and its Slack posts with a signature.
          default: true
        signature:
          type: string
          title: Signature
          description: Empty picks one of ten built-in sign-offs for each deployment.
          examples:
          - Hey, thanks for monkeyin' around. 🐒🤙🏼🏄‍♂️
        slack:
          type: object
          title: Slack
          properties:
            channel:
              type: string
              title: Channel
              description: The channel for what each run sent and how each deployment ended. Empty writes them to the
                logs only.
              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
              message:
                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
        massdriver:
          type: object
          title: Massdriver UI
          properties:
            app_url:
              type: string
              title: App URL
              description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
              pattern: ^https?://[^\s]+$
              message:
                pattern: Must be a URL.
        results:
          type: object
          title: Stash results
          properties:
            prefix:
              type: string
              title: Key prefix
              description: The start of the stash keys of the results the automation writes. The server accepts `md/v1`
                keys once its widget catalog has them. Until then, a prefix outside `md/`, such as `results/v1`, shows
                each result as a labeled row.
              default: md/v1
              pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
              message:
                pattern: Must be letters, digits, and `_ . -`, in parts separated by `/`, such as results/v1.
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    SLACK_BOT_TOKEN:
      title: Slack bot token
      description: The `xoxb-` token of the Slack app. Posts go to the channels in the settings.
    SLACK_WEBHOOK_URL:
      title: Slack webhook URL
      description: An incoming webhook, for a workspace without the Slack app. Every post goes to its one channel. Ignored
        when the bot token is set.
    CHAOS_MONKEY_RUN_TOKEN:
      title: Run token
      description: 'Callers of `POST /chaos-monkey/run` send it as `Authorization: Bearer <token>`.'
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    ui:order:
    - match
    - mode
    - schedule
    - timezone
    - status
    - instances
    - strategies
    - mutate
    - gibberish
    - sign_off
    - signature
    - slack
    - massdriver
    - results
    status:
      ui:widget: checkboxes
      ui:options:
        inline: true
