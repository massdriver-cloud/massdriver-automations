name: massdriver-proposal-chatops-ecs
description: Posts each proposed deployment to Slack with Approve and Reject buttons. Needs the `SLACK_BOT_TOKEN` and
  `SLACK_SIGNING_SECRET` secrets. Set the Slack app's interactivity URL to `https://<host>/slack/interactions`. Runs on
  Amazon ECS with Fargate, with an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-proposal-chatops-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - logs
  - config
  - attributes
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.1.0`. Pin a version so that a redeploy runs the same code.
          default: '0.1'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `proposal-chatops.<domain of the cluster's hosted zone>`.
            The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      required:
      - slack
      properties:
        slack:
          type: object
          title: Slack
          required:
          - channel
          properties:
            channel:
              type: string
              title: Channel
              description: The channel for proposals. Invite the app to a private channel.
              default: '#deploys'
              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
              message:
                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
            channel_attribute:
              type: string
              title: Channel attribute
              description: An instance attribute whose value names the channel for its proposals.
              examples:
              - slack_channel
            allowed_users:
              type: array
              title: Allowed users
              description: Slack user IDs that can approve and reject. Empty allows everybody in the channel.
              items:
                type: string
                title: Slack user ID
                pattern: ^[UW][A-Z0-9]+$
                message:
                  pattern: Must be a Slack user ID, such as U012ABCDEF.
              default: []
    attributes:
      type: object
      title: Event attributes
      description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends events
        of any attributes.
      default: {}
      additionalProperties:
        type: string
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    SLACK_BOT_TOKEN:
      title: Slack bot token
      description: The `xoxb-` token of the Slack app. Posts go to the channels in the settings.
    SLACK_SIGNING_SECRET:
      title: Slack signing secret
      description: The signing secret of the Slack app, to check button clicks.
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - attributes
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    slack:
      ui:order:
      - channel
      - channel_attribute
      - allowed_users
      allowed_users:
        ui:field: tagInput
  attributes:
    ui:options:
      addButtonText: Add attribute
