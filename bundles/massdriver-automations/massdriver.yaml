name: massdriver-automations
description: >-
  Runs Massdriver automations on a Kubernetes cluster. Each enabled automation gets a Deployment, a Service, an
  Ingress host, and an event destination that sends it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-automations
version: 0.1.0

steps:
  - path: src
    provisioner: opentofu:1.10

params:
  required:
    - image
    - ingress
    - audit_archiver
    - autodeploy_downstream
    - bundle_scanner
    - cost_explorer
    - drift
    - freeze_guard
    - github_deployments
    - proposal_chatops
    - release_notes
    - rollback_on_failure
    - router
    - sandbox_on_join
    - statuspage
  properties:
    image:
      type: object
      title: Image
      required:
        - repository
        - tag
      properties:
        repository:
          type: string
          title: Repository
          description: >-
            The automations image. bundle-scanner uses the same repository with `-scanner` after the tag, and router
            with `-scripts` when it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `1.2.0`. Pin a version so that a redeploy runs the same code.
          default: "0.1"
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
        - domain
      properties:
        domain:
          type: string
          title: Domain
          description: >-
            Each automation is served at `<automation>.<domain>`, such as `freeze-guard.automations.acme.com`.
            Point a wildcard DNS record for `*.<domain>` at the ingress controller. Massdriver sends events to
            `https://<automation>.<domain>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name with at least one dot, such as automations.acme.com.
        class_name:
          type: string
          title: Ingress class
          description: The IngressClass to use. Leave empty to use the default class of the cluster.
        cluster_issuer:
          type: string
          title: cert-manager ClusterIssuer
          description: >-
            Issues a certificate for each host with cert-manager. Leave empty when TLS ends in front of the
            ingress controller, or when you set a TLS secret.
        tls_secret_name:
          type: string
          title: TLS secret
          description: >-
            A Secret in the namespace that holds a certificate for `*.<domain>`. Ignored when a ClusterIssuer is
            set.

    audit_archiver:
      type: object
      title: Audit archiver
      description: Archives every event, unchanged, to disk, S3, Splunk, or Datadog. Every event goes to every sink that is
        on. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/audit-archiver)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run audit-archiver
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Sinks
                properties:
                  s3:
                    type: object
                    title: S3
                    description: S3 or an S3-compatible store. Credentials come from the AWS secrets.
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                        title: Archive to S3
                        default: false
                    dependencies:
                      enabled:
                        oneOf:
                        - properties:
                            enabled:
                              const: false
                        - properties:
                            enabled:
                              const: true
                            bucket:
                              type: string
                              title: Bucket
                              examples:
                              - acme-massdriver-audit
                            region:
                              type: string
                              title: Region
                              description: The region of the bucket. Use `auto` for Cloudflare R2.
                              examples:
                              - us-east-1
                            prefix:
                              type: string
                              title: Key prefix
                              description: The first part of each key.
                              default: events
                            endpoint:
                              type: string
                              title: Endpoint
                              description: The URL of an S3-compatible store, such as MinIO or Cloudflare R2. Empty uses AWS.
                              pattern: ^https?://[^\s]+$
                              message:
                                pattern: Must be a URL.
                            object_lock_days:
                              type: integer
                              title: Object Lock retention (days)
                              description: Retains each object for this many days. The bucket must have Object Lock turned
                                on. 0 sets no retention.
                              default: 0
                              minimum: 0
                            object_lock_mode:
                              type: string
                              title: Object Lock mode
                              oneOf:
                              - const: COMPLIANCE
                                title: Compliance
                              - const: GOVERNANCE
                                title: Governance
                              default: COMPLIANCE
                          required:
                          - bucket
                          - region
                  splunk:
                    type: object
                    title: Splunk
                    description: A Splunk HTTP Event Collector. The `AUDIT_ARCHIVER_SPLUNK_HEC_TOKEN` secret holds the token.
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                        title: Archive to Splunk
                        default: false
                    dependencies:
                      enabled:
                        oneOf:
                        - properties:
                            enabled:
                              const: false
                        - properties:
                            enabled:
                              const: true
                            url:
                              type: string
                              title: Collector URL
                              examples:
                              - https://splunk.example.com:8088
                              pattern: ^https?://[^\s]+$
                              message:
                                pattern: Must be a URL.
                            index:
                              type: string
                              title: Index
                              description: Empty uses the default index of the token.
                            source:
                              type: string
                              title: Source
                              default: massdriver
                            sourcetype:
                              type: string
                              title: Source type
                              default: massdriver:cloudevent
                          required:
                          - url
                  datadog:
                    type: object
                    title: Datadog
                    description: The Datadog Logs intake. The `AUDIT_ARCHIVER_DD_API_KEY` secret holds the API key.
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                        title: Archive to Datadog
                        default: false
                    dependencies:
                      enabled:
                        oneOf:
                        - properties:
                            enabled:
                              const: false
                        - properties:
                            enabled:
                              const: true
                            site:
                              type: string
                              title: Site
                              description: Your Datadog site, such as datadoghq.eu or us5.datadoghq.com.
                              default: datadoghq.com
                            service:
                              type: string
                              title: Service
                              default: massdriver
                            tags:
                              type: array
                              title: Tags
                              items:
                                type: string
                                title: Tag
                                examples:
                                - env:prod
                              default: []
                          required: []
                  disk:
                    type: object
                    title: Disk
                    description: A directory in the container. Files are lost when the container restarts, so use it only
                      to test.
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                        title: Archive to Disk
                        default: false
                    dependencies:
                      enabled:
                        oneOf:
                        - properties:
                            enabled:
                              const: false
                        - properties:
                            enabled:
                              const: true
                            dir:
                              type: string
                              title: Directory
                              default: /var/lib/audit-archiver
                              pattern: ^/.+
                          required:
                          - dir
            required:
            - config
    autodeploy_downstream:
      type: object
      title: Autodeploy downstream
      description: Deploys the dependents of an instance after it deploys. Each rule selects dependents by their attributes.
        The first rule that matches a dependent applies. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/autodeploy-downstream)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run autodeploy-downstream
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Rules
                properties:
                  rules:
                    type: array
                    title: Rules
                    items:
                      type: object
                      title: Rule
                      required:
                      - name
                      - downstream
                      - action
                      properties:
                        name:
                          type: string
                          title: Name
                          description: Unique. The logs and the deployment message name the rule.
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          message:
                            pattern: Must be lowercase letters, numbers, and hyphens.
                        downstream:
                          type: object
                          title: Dependent attributes
                          description: Attributes that a dependent must have to deploy, such as `autodeploy` = `true`. Separate
                            values with commas to match any of them, such as `api, web`.
                          default: {}
                          additionalProperties:
                            type: string
                        upstream:
                          type: object
                          title: Upstream attributes
                          description: Attributes that the instance that deployed must have. Empty matches every instance.
                            Separate values with commas to match any of them, such as `api, web`.
                          default: {}
                          additionalProperties:
                            type: string
                        action:
                          type: string
                          title: Action
                          oneOf:
                          - const: deploy
                            title: Deploy now
                          - const: propose
                            title: Propose a deployment for a person to approve
                          default: deploy
                    minItems: 1
                    default:
                    - name: autodeploy
                      downstream:
                        autodeploy: 'true'
                      upstream: {}
                      action: deploy
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - attributes
    bundle_scanner:
      type: object
      title: Bundle scanner
      description: Scans each new bundle version with Trivy and Checkov, and posts the results. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/bundle-scanner)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run bundle-scanner
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Scan
                properties:
                  scanners:
                    type: array
                    title: Scanners
                    items:
                      type: string
                      enum:
                      - trivy
                      - checkov
                    uniqueItems: true
                    minItems: 1
                    default:
                    - trivy
                    - checkov
                  fail_severity:
                    type: string
                    title: Fail at
                    description: A version fails when a finding has this severity or higher.
                    oneOf:
                    - const: CRITICAL
                      title: Critical
                    - const: HIGH
                      title: High or higher
                    - const: MEDIUM
                      title: Medium or higher
                    - const: LOW
                      title: Low or higher
                    - const: UNKNOWN
                      title: Any finding
                    default: HIGH
                  result_attribute:
                    type: string
                    title: Result attribute
                    description: A repo custom attribute that records the result as `passed` or `failed`. Empty sets no attribute.
                    examples:
                    - iac_scan
                  timeout:
                    type: string
                    title: Timeout
                    description: The longest time for one bundle version.
                    default: 10m
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    message:
                      pattern: Must be a duration, such as 90s, 10m, or 1h30m.
                  slack:
                    type: object
                    title: Slack
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for results. Empty posts nothing.
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - attributes
    cost_explorer:
      type: object
      title: Cost explorer
      description: Serves a dashboard of the cloud costs of every instance. Group and filter by any instance attribute, and
        see the daily trend. Set the `COST_EXPLORER_PASSWORD` secret, or make it public. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/cost-explorer)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run cost-explorer
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Dashboard
                properties:
                  title:
                    type: string
                    title: Title
                    default: Cloud costs
                  dimensions:
                    type: array
                    title: Dimensions
                    description: Instance attributes to group and filter by, in this order. `bundle` is the bundle name. Only
                      these attributes reach the browser.
                    items:
                      type: string
                      title: Attribute
                      examples:
                      - team
                    uniqueItems: true
                    minItems: 1
                    default:
                    - md-project
                    - md-environment
                    - md-component
                    - bundle
                  refresh:
                    type: string
                    title: Refresh
                    description: How often to read the costs. A completed provision or decommission also reads them.
                    default: 1h
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    message:
                      pattern: Must be a duration, such as 90s, 10m, or 1h30m.
                  history_days:
                    type: integer
                    title: History (days)
                    description: Days of daily cost history to keep.
                    default: 90
                    minimum: 1
                    maximum: 731
                  public:
                    type: boolean
                    title: Public
                    description: Serves the dashboard without a password. Costs can reveal what you run.
                    default: false
                  username:
                    type: string
                    title: Username
                    description: The basic auth user. The `COST_EXPLORER_PASSWORD` secret is the password.
                    default: massdriver
                  massdriver:
                    type: object
                    title: Massdriver UI
                    properties:
                      app_url:
                        type: string
                        title: App URL
                        description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
              host:
                type: string
                title: Host
                description: The host of the dashboard, such as `costs.acme.com`. Empty uses `cost-explorer.<domain>`.
              storage_size_gi:
                type: integer
                title: History storage (GiB)
                description: The volume for the daily cost history.
                default: 1
                minimum: 1
                maximum: 10
                $md.immutable: true
            required:
            - config
            - storage_size_gi
    drift:
      type: object
      title: Drift detection
      description: Plans the instances of each check on a schedule, and alerts Slack when the cloud no longer matches the
        last deployment. Set the `DRIFT_RUN_TOKEN` secret to start checks with `POST https://drift.<domain>/drift/run?check=<name>`.
        [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/drift)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run drift
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Checks
                required:
                - checks
                properties:
                  slack:
                    type: object
                    title: Slack
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for checks that do not name their own. Empty writes alerts to the logs only.
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                  checks:
                    type: array
                    title: Checks
                    items:
                      type: object
                      title: Check
                      required:
                      - name
                      - match
                      - mode
                      - resolve_with
                      properties:
                        name:
                          type: string
                          title: Name
                          description: Unique. Alerts and `POST /drift/run?check=<name>` use it.
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          message:
                            pattern: Must be lowercase letters, numbers, and hyphens.
                        match:
                          type: object
                          title: Instance attributes
                          description: Effective attributes of the instances to plan. Separate values with commas to match
                            any of them, such as `api, web`.
                          default: {}
                          additionalProperties:
                            type: string
                        schedule:
                          type: string
                          title: Schedule
                          description: Standard cron (minute, hour, day of month, month, day of week), or `@daily`, `@hourly`,
                            `@every 6h`. Empty runs the check only from `POST /drift/run`.
                          examples:
                          - 0 6 * * *
                        timezone:
                          type: string
                          title: Time zone
                          description: The time zone of the schedule.
                          default: UTC
                          examples:
                          - America/New_York
                          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
                          message:
                            pattern: Must be an IANA time zone, such as America/New_York or UTC.
                        mode:
                          type: string
                          title: When drift is found
                          oneOf:
                          - const: detect
                            title: Alert only
                          - const: propose
                            title: Propose a deployment that removes it
                          - const: resolve
                            title: Deploy now to remove it
                          default: detect
                        resolve_with:
                          type: string
                          title: Restore
                          oneOf:
                          - const: deployed
                            title: The last completed deployment
                          - const: saved
                            title: The saved configuration, with the current bundle version
                          default: deployed
                        max_concurrent:
                          type: integer
                          title: Plans at once
                          description: The rest wait in a queue.
                          default: 5
                          minimum: 1
                          maximum: 50
                        notify_clean:
                          type: boolean
                          title: Also post instances without drift
                          default: false
                        summary:
                          type: boolean
                          title: Post totals when the run finishes
                          default: false
                        slack:
                          type: object
                          title: Slack
                          properties:
                            channel:
                              type: string
                              title: Channel
                              description: Replaces the default channel for this check.
                              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                              message:
                                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                        patterns:
                          type: object
                          title: Plan log patterns
                          description: Regular expressions (Go RE2) that read the plan logs. Change them only for a provisioner
                            whose plan output differs.
                          properties:
                            clean:
                              type: string
                              title: No changes
                              default: No changes\.
                            drift:
                              type: string
                              title: Drift
                              default: 'Plan: \d+ to \w+(?:, \d+ to \w+)*'
                            resource:
                              type: string
                              title: Changed resource
                              default: (?m)^\s*# \S+.* (?:will be|must be) .*$
                    minItems: 1
                    default:
                    - name: prod-nightly
                      schedule: 0 6 * * *
                      timezone: UTC
                      match:
                        md-environment: prod
                      mode: detect
                      resolve_with: deployed
                  massdriver:
                    type: object
                    title: Massdriver UI
                    properties:
                      app_url:
                        type: string
                        title: App URL
                        description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
              storage_size_gi:
                type: integer
                title: State storage (GiB)
                description: The volume for the plans in progress and the queues.
                default: 1
                minimum: 1
                maximum: 10
                $md.immutable: true
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - storage_size_gi
            - attributes
    freeze_guard:
      type: object
      title: Change freezes
      description: During each window, adds deny policies for deployments to every custom group except the exempt groups,
        and removes them when it ends. Set the `FREEZE_GUARD_ADMIN_TOKEN` secret to lift a window early with `POST https://freeze-guard.<domain>/freeze/lift?window=<name>`.
        [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/freeze-guard)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run freeze-guard
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Windows
                properties:
                  timezone:
                    type: string
                    title: Default time zone
                    default: UTC
                    examples:
                    - America/New_York
                    pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
                    message:
                      pattern: Must be an IANA time zone, such as America/New_York or UTC.
                  exempt_groups:
                    type: array
                    title: Exempt groups
                    description: Groups that every window leaves alone, such as the on-call team.
                    items:
                      type: string
                      $md.list:
                        resource: group
                    uniqueItems: true
                    default: []
                  actions:
                    type: array
                    title: Denied actions
                    items:
                      type: string
                      oneOf:
                      - const: instance:deploy
                        title: Deploy instances
                      - const: instance:decommission
                        title: Decommission instances
                      - const: environment:deploy
                        title: Deploy environments
                      - const: environment:decommission
                        title: Decommission environments
                    uniqueItems: true
                    minItems: 1
                    default:
                    - instance:deploy
                    - instance:decommission
                    - environment:deploy
                    - environment:decommission
                  slack:
                    type: object
                    title: Slack
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for window starts, ends, and lifts. Empty posts nothing.
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                  windows:
                    type: array
                    title: Windows
                    items:
                      type: object
                      title: Window
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          title: Name
                          description: Unique. `POST /freeze/lift?window=<name>` uses it.
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          message:
                            pattern: Must be lowercase letters, numbers, and hyphens.
                        match:
                          type: object
                          title: Attributes
                          description: Attributes of the instances and environments to freeze. `*` matches any value. Empty
                            freezes everything. Separate values with commas to match any of them, such as `api, web`.
                          default: {}
                          additionalProperties:
                            type: string
                        weekly:
                          type: array
                          title: Every week
                          description: Ranges from a day and time to a day and time. A range that ends before it starts wraps
                            past Sunday.
                          items:
                            type: object
                            title: Range
                            required:
                            - from
                            - to
                            properties:
                              from:
                                type: string
                                title: From
                                pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-2][0-9]:[0-5][0-9]$
                                examples:
                                - Fri 17:00
                                message:
                                  pattern: Must be a day and a time, such as Fri 17:00.
                              to:
                                type: string
                                title: To
                                pattern: ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) [0-2][0-9]:[0-5][0-9]$
                                examples:
                                - Mon 08:00
                                message:
                                  pattern: Must be a day and a time, such as Mon 08:00.
                          default: []
                        from:
                          type: string
                          title: Once, from
                          description: 'A fixed window instead of a weekly one: `YYYY-MM-DD`, `YYYY-MM-DD HH:MM`, or RFC 3339.'
                          examples:
                          - '2026-12-24'
                        to:
                          type: string
                          title: Once, to
                          examples:
                          - 2026-12-26 12:00
                        timezone:
                          type: string
                          title: Time zone
                          description: Replaces the default time zone for this window.
                          examples:
                          - America/New_York
                          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
                          message:
                            pattern: Must be an IANA time zone, such as America/New_York or UTC.
                        exempt_groups:
                          type: array
                          title: More exempt groups
                          items:
                            type: string
                            $md.list:
                              resource: group
                          uniqueItems: true
                          default: []
                        actions:
                          type: array
                          title: Denied actions
                          items:
                            type: string
                            oneOf:
                            - const: instance:deploy
                              title: Deploy instances
                            - const: instance:decommission
                              title: Decommission instances
                            - const: environment:deploy
                              title: Deploy environments
                            - const: environment:decommission
                              title: Decommission environments
                          uniqueItems: true
                          minItems: 1
                          description: Replaces the default actions for this window.
                        slack:
                          type: object
                          title: Slack
                          properties:
                            channel:
                              type: string
                              title: Channel
                              description: Replaces the default channel for this window.
                              pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                              message:
                                pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                    default: []
              storage_size_gi:
                type: integer
                title: State storage (GiB)
                description: The volume for the ids of the policies that freeze-guard created, and the lifts.
                default: 1
                minimum: 1
                maximum: 10
                $md.immutable: true
            required:
            - config
            - storage_size_gi
    github_deployments:
      type: object
      title: GitHub Deployments
      description: Shows Massdriver deployments as GitHub Deployments on the repository that an instance names. Set the `GITHUB_DEPLOYMENTS_TOKEN`
        secret. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/github-deployments)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run github-deployments
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: GitHub
                properties:
                  github:
                    type: object
                    title: GitHub
                    properties:
                      repo_attribute:
                        type: string
                        title: Repository attribute
                        description: The instance attribute that names the repository, as `owner/name`.
                        default: github_repo
                      ref_attribute:
                        type: string
                        title: Ref attribute
                        description: The instance attribute that names the ref. Without it, the deployment uses the default
                          branch.
                        default: github_ref
                      environment_name:
                        type: string
                        title: GitHub environment
                        oneOf:
                        - const: environment
                          title: The environment, such as prod
                        - const: project-environment
                          title: The project and environment, such as api-prod
                        default: environment
                      api_url:
                        type: string
                        title: API URL
                        description: 'For GitHub Enterprise Server: `https://<host>/api/v3`.'
                        default: https://api.github.com
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
                  massdriver:
                    type: object
                    title: Massdriver UI
                    properties:
                      app_url:
                        type: string
                        title: App URL
                        description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
            required:
            - config
    proposal_chatops:
      type: object
      title: Slack approvals
      description: Posts each proposed deployment to Slack with Approve and Reject buttons. Needs the `SLACK_BOT_TOKEN` and
        `SLACK_SIGNING_SECRET` secrets. Set the Slack app's interactivity URL to `https://proposal-chatops.<domain>/slack/interactions`.
        [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/proposal-chatops)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run proposal-chatops
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Slack
                required:
                - slack
                properties:
                  slack:
                    type: object
                    title: Slack
                    required:
                    - channel
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for proposals. Invite the app to a private channel.
                        default: '#deploys'
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                      channel_attribute:
                        type: string
                        title: Channel attribute
                        description: An instance attribute whose value names the channel for its proposals.
                        examples:
                        - slack_channel
                      allowed_users:
                        type: array
                        title: Allowed users
                        description: Slack user IDs that can approve and reject. Empty allows everybody in the channel.
                        items:
                          type: string
                          title: Slack user ID
                          pattern: ^[UW][A-Z0-9]+$
                          message:
                            pattern: Must be a Slack user ID, such as U012ABCDEF.
                        default: []
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - attributes
    release_notes:
      type: object
      title: Release notes
      description: Posts each new bundle version, and the instances that can upgrade, to Slack or Microsoft Teams. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/release-notes)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run release-notes
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Posts
                properties:
                  slack:
                    type: object
                    title: Slack
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for release notes. Empty posts nothing to Slack.
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                  teams:
                    type: object
                    title: Microsoft Teams
                    properties:
                      enabled:
                        type: boolean
                        title: Post to Teams
                        description: Posts an Adaptive Card to the webhook in the `RELEASE_NOTES_TEAMS_WEBHOOK_URL` secret.
                        default: false
                  include_development:
                    type: boolean
                    title: Include development versions
                    description: Also post versions such as `1.3.1-dev.20261124T055403Z`.
                    default: false
            required:
            - config
    rollback_on_failure:
      type: object
      title: Rollback on failure
      description: When a deployment of an opted-in instance fails, deploys its last completed deployment again. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/rollback-on-failure)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run rollback-on-failure
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Rollback
                required:
                - attribute
                properties:
                  attribute:
                    type: object
                    title: Opt-in attribute
                    description: Instances with this attribute roll back. The key must be a component custom attribute that
                      allows the value.
                    required:
                    - key
                    - value
                    properties:
                      key:
                        type: string
                        title: Key
                        default: autorollback
                      value:
                        type: string
                        title: Value
                        default: 'true'
                  slack:
                    type: object
                    title: Slack
                    properties:
                      channel:
                        type: string
                        title: Channel
                        description: The channel for rollback notices. The result is a reply in the notice's thread. Empty
                          posts nothing.
                        pattern: ^([#@]?[a-z0-9._-]+|[CG][A-Z0-9]+)$
                        message:
                          pattern: 'Must be a channel name, such as #infra, or a channel ID.'
                  massdriver:
                    type: object
                    title: Massdriver UI
                    properties:
                      app_url:
                        type: string
                        title: App URL
                        description: The Massdriver UI, for the links in messages. Empty uses https://app.massdriver.cloud.
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - attributes
    router:
      type: object
      title: Router
      description: Runs HTTP requests, commands, and Massdriver API calls for the events that match its routes. The event
        destination sends the event types of every route. The `ROUTER_ENV` secret is a JSON object of extra environment variables,
        for `env.NAME` in jq or `{{ env "NAME" }}` in Go templates. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/router)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run router
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: string
                title: Routes (YAML)
                description: The YAML config of router. See the [router README](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/router).
                default: |
                  routes:
                    - name: log-failures
                      events: [deployment.failed]
                      do:
                        - http:
                            url: https://example.com/hooks/massdriver-failures
              scripts:
                type: object
                title: Scripts
                description: Files for `exec` steps, by file name, mounted as executables in `/scripts`. A route with an `exec`
                  step, or any script, runs the `-scripts` image, which has `sh`, `jq`, `curl`, and `python3`.
                default: {}
                propertyNames:
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                additionalProperties:
                  type: string
            required:
            - config
            - scripts
    sandbox_on_join:
      type: object
      title: Sandboxes for new members
      description: Forks a template environment for each person who joins a group, and removes it when they leave. [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/sandbox-on-join)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run sandbox-on-join
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Sandboxes
                required:
                - sandboxes
                properties:
                  sandboxes:
                    type: array
                    title: Rules
                    items:
                      type: object
                      title: Rule
                      required:
                      - group
                      - project
                      - environment
                      properties:
                        group:
                          type: string
                          title: Group
                          description: Each person who joins it gets a sandbox.
                          $md.list:
                            resource: group
                        project:
                          type: string
                          title: Project
                          description: The project of the template. Forks go into the same project.
                          $md.list:
                            resource: project
                        environment:
                          type: string
                          title: Template environment
                        deploy:
                          type: boolean
                          title: Deploy the fork after it is created
                          default: false
                        deleteAfterDecommission:
                          type: boolean
                          title: Delete the fork after its decommission, when the person leaves
                          default: false
                        copyEnvironmentDefaults:
                          type: boolean
                          title: Copy the template's environment defaults
                          default: false
                        copySecrets:
                          type: boolean
                          title: Copy the secrets of the template's instances
                          default: false
                        copyRemoteReferences:
                          type: boolean
                          title: Copy the template's remote references
                          default: false
                    minItems: 1
            required:
            - config
    statuspage:
      type: object
      title: Status page
      description: Serves a public status page from the alarms, instances, and deployments of the environments on its pages.
        [Docs](https://github.com/massdriver-cloud/massdriver-automations/tree/main/automations/statuspage)
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          title: Run statuspage
          default: false
      dependencies:
        enabled:
          oneOf:
          - properties:
              enabled:
                const: false
          - properties:
              enabled:
                const: true
              config:
                type: object
                title: Status page
                required:
                - site
                - pages
                properties:
                  site:
                    type: object
                    title: Site
                    required:
                    - title
                    properties:
                      title:
                        type: string
                        title: Title
                        default: Status
                      base_url:
                        type: string
                        title: Base URL
                        description: Absolute URLs in the Atom feed and `status.json` start with this.
                        examples:
                        - https://status.acme.com
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
                      logo:
                        type: string
                        title: Logo URL
                        pattern: ^https?://[^\s]+$
                        message:
                          pattern: Must be a URL.
                      accent_color:
                        type: string
                        title: Accent color
                        default: '#2563eb'
                        pattern: ^#[0-9a-fA-F]{3,8}$
                        message:
                          pattern: 'Must be a hex color, such as #2563eb.'
                      timezone:
                        type: string
                        title: Time zone
                        description: Dates and the day boundaries of the uptime bars use this zone.
                        default: UTC
                        examples:
                        - America/New_York
                        pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$
                        message:
                          pattern: Must be an IANA time zone, such as America/New_York or UTC.
                      show_alarm_details:
                        type: boolean
                        title: Show alarm names and messages
                        description: They can name internal resources.
                        default: false
                      footer_links:
                        type: array
                        title: Footer links
                        items:
                          type: object
                          title: Link
                          required:
                          - title
                          - url
                          properties:
                            title:
                              type: string
                              title: Title
                            url:
                              type: string
                              title: URL
                              pattern: ^https?://[^\s]+$
                              message:
                                pattern: Must be a URL.
                        default: []
                  pages:
                    type: array
                    title: Pages
                    items:
                      type: object
                      title: Page
                      required:
                      - title
                      - environments
                      properties:
                        title:
                          type: string
                          title: Title
                        slug:
                          type: string
                          title: Slug
                          description: The page's path. The first page is also served at `/`.
                          pattern: ^[a-z0-9][a-z0-9-]*$
                          message:
                            pattern: Must be lowercase letters, numbers, and hyphens.
                        description:
                          type: string
                          title: Description
                        environments:
                          type: array
                          title: Environments
                          items:
                            type: object
                            title: Environment
                            required:
                            - id
                            - title
                            properties:
                              id:
                                type: string
                                title: Environment
                                description: The environment as `<project>-<environment>`, such as `api-prod`.
                                pattern: ^[a-z0-9]+-[a-z0-9]+$
                                message:
                                  pattern: Must be <project>-<environment>, such as api-prod.
                              title:
                                type: string
                                title: Title
                              description:
                                type: string
                                title: Description
                              components:
                                type: array
                                title: Rows
                                description: Rows appear in this order. Empty shows one row for each instance.
                                items:
                                  type: object
                                  title: Row
                                  required:
                                  - title
                                  - match
                                  properties:
                                    title:
                                      type: string
                                      title: Title
                                    description:
                                      type: string
                                      title: Description
                                    match:
                                      type: object
                                      title: Instance attributes
                                      description: The instances in this row, such as `md-component` = `api`. An instance
                                        belongs to the first row it matches.
                                      default: {}
                                      additionalProperties:
                                        type: string
                                    impact:
                                      type: string
                                      title: Impact
                                      description: How a firing alarm of an instance in this row shows.
                                      oneOf:
                                      - const: degraded
                                        title: Degraded performance
                                      - const: partial_outage
                                        title: Partial outage
                                      - const: major_outage
                                        title: Major outage
                                      default: major_outage
                                default: []
                          minItems: 1
                    minItems: 1
                    default:
                    - title: Status
                      slug: status
                      environments:
                      - id: api-prod
                        title: Production
                        components: []
                  history_days:
                    type: integer
                    title: History (days)
                    description: Days of uptime bars and incident history.
                    default: 90
                    minimum: 1
                    maximum: 365
                  min_duration:
                    type: string
                    title: Minimum alarm duration
                    description: An alarm must fire this long to count as an incident.
                    default: 2m
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                    message:
                      pattern: Must be a duration, such as 90s, 10m, or 1h30m.
                  deploys_as_maintenance:
                    type: boolean
                    title: Show deployments as maintenance
                    description: A running deployment shows its row as under maintenance.
                    default: true
                  announcements:
                    type: array
                    title: Announcements
                    items:
                      type: object
                      title: Announcement
                      required:
                      - message
                      - level
                      properties:
                        message:
                          type: string
                          title: Message
                        level:
                          type: string
                          title: Level
                          oneOf:
                          - const: info
                            title: Info
                          - const: warning
                            title: Warning
                          - const: critical
                            title: Critical
                          default: info
                        url:
                          type: string
                          title: Link
                          pattern: ^https?://[^\s]+$
                          message:
                            pattern: Must be a URL.
                        pages:
                          type: array
                          title: Pages
                          description: Empty shows it on every page.
                          items:
                            type: string
                            title: Page slug
                          default: []
                        starts_at:
                          type: string
                          title: Starts
                          format: date-time
                        ends_at:
                          type: string
                          title: Ends
                          format: date-time
                    default: []
                  maintenance:
                    type: array
                    title: Scheduled maintenance
                    items:
                      type: object
                      title: Maintenance
                      required:
                      - title
                      - starts_at
                      - ends_at
                      - environments
                      properties:
                        title:
                          type: string
                          title: Title
                        description:
                          type: string
                          title: Description
                        starts_at:
                          type: string
                          title: Starts
                          format: date-time
                        ends_at:
                          type: string
                          title: Ends
                          format: date-time
                        environments:
                          type: array
                          title: Environments
                          items:
                            type: string
                            title: Environment
                            examples:
                            - api-prod
                          minItems: 1
                        components:
                          type: array
                          title: Rows
                          description: Empty covers the whole environment.
                          items:
                            type: string
                            title: Row title
                          default: []
                    default: []
                  attributes:
                    type: object
                    title: Instance attributes
                    properties:
                      title:
                        type: string
                        title: Title attribute
                        description: Names the row of an instance in an environment without rows.
                        default: status_title
                      hidden:
                        type: string
                        title: Hidden attribute
                        description: '`true` hides the instance.'
                        default: status_hidden
                      impact:
                        type: string
                        title: Impact attribute
                        description: Sets the impact of the instance's alarms.
                        default: status_impact
                  output_dir:
                    type: string
                    title: Output directory
                    description: Writes the static site here after each change, to serve or sync elsewhere. Empty writes no
                      files.
                    pattern: ^(/.+)?$
              host:
                type: string
                title: Host
                description: The public host of the status page, such as `status.acme.com`. Empty uses `statuspage.<domain>`.
              storage_size_gi:
                type: integer
                title: History storage (GiB)
                description: The volume for incident and uptime history.
                default: 1
                minimum: 1
                maximum: 10
                $md.immutable: true
              output_size_gi:
                type: integer
                title: Site storage (GiB)
                description: The volume mounted at the output directory, when it is set. Other pods on the same node can mount
                  its claim, `<instance>-statuspage-site`, to serve or copy the files.
                default: 1
                minimum: 1
                maximum: 10
                $md.immutable: true
              attributes:
                type: object
                title: Event attributes
                description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends
                  events of any attributes.
                default: {}
                additionalProperties:
                  type: string
            required:
            - config
            - storage_size_gi
            - output_size_gi
            - attributes

    otel:
      type: object
      title: Tracing
      description: >-
        Sends OpenTelemetry traces of every automation to an OTLP endpoint. Empty turns tracing off. Set the
        `OTEL_EXPORTER_OTLP_HEADERS` secret when the endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: >-
            The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Each
            automation sends spans to `<endpoint>/v1/traces`.

dependencies:
  kubernetes_cluster:
    resource_type: massdriver-kubernetes-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true

resources:
  automations:
    resource_type: automation-server
    required: false

app:
  secrets:
    SLACK_BOT_TOKEN:
      title: Slack bot token
      description: >-
        The `xoxb-` token of the Slack app. Every automation that posts to Slack uses it, with the channels in its
        configuration.
    SLACK_SIGNING_SECRET:
      title: Slack signing secret
      description: The signing secret of the Slack app. proposal-chatops checks button clicks with it.
    SLACK_WEBHOOK_URL:
      title: Slack webhook URL
      description: >-
        An incoming webhook, for a workspace without the Slack app. Every automation that posts sends to its one
        channel. Ignored when the bot token is set.
    AUDIT_ARCHIVER_AWS_ACCESS_KEY_ID:
      title: audit-archiver AWS access key ID
    AUDIT_ARCHIVER_AWS_SECRET_ACCESS_KEY:
      title: audit-archiver AWS secret access key
    AUDIT_ARCHIVER_SPLUNK_HEC_TOKEN:
      title: audit-archiver Splunk HEC token
    AUDIT_ARCHIVER_DD_API_KEY:
      title: audit-archiver Datadog API key
    COST_EXPLORER_PASSWORD:
      title: cost-explorer password
      description: >-
        The basic auth password of the cost dashboard. The user is the `username` in its settings, `massdriver` by
        default.
    DRIFT_RUN_TOKEN:
      title: drift run token
      description: >-
        Callers of `POST /drift/run` send it as `Authorization: Bearer <token>`.
    FREEZE_GUARD_ADMIN_TOKEN:
      title: freeze-guard admin token
      description: >-
        Callers of `POST /freeze/lift` send it as `Authorization: Bearer <token>`.
    GITHUB_DEPLOYMENTS_TOKEN:
      title: github-deployments GitHub token
      description: Needs `Deployments` write and `Metadata` read, or the `repo_deployment` scope.
    RELEASE_NOTES_TEAMS_WEBHOOK_URL:
      title: release-notes Teams webhook URL
    ROUTER_ENV:
      title: router environment
      description: >-
        A JSON object of environment variables for routes, such as `{"PAGERDUTY_ROUTING_KEY": "..."}`.
      json: true
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: >-
        Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as
        `authorization=Bearer abc123`.

ui:
  ui:order:
    - image
    - ingress
    - audit_archiver
    - autodeploy_downstream
    - bundle_scanner
    - cost_explorer
    - drift
    - freeze_guard
    - github_deployments
    - proposal_chatops
    - release_notes
    - rollback_on_failure
    - router
    - sandbox_on_join
    - statuspage
    - otel
    - "*"
  image:
    ui:order: [repository, tag]
  ingress:
    ui:order: [domain, class_name, cluster_issuer, tls_secret_name]
  audit_archiver:
    ui:order:
    - enabled
    - '*'
    config:
      ui:order:
      - s3
      - splunk
      - datadog
      - disk
      s3:
        ui:order:
        - enabled
        - '*'
      splunk:
        ui:order:
        - enabled
        - '*'
      datadog:
        ui:order:
        - enabled
        - '*'
        tags:
          ui:field: tagInput
      disk:
        ui:order:
        - enabled
        - '*'
  autodeploy_downstream:
    ui:order:
    - enabled
    - '*'
    config:
      rules:
        ui:options:
          itemTitle: '{{name}}'
        items:
          ui:order:
          - name
          - action
          - downstream
          - upstream
