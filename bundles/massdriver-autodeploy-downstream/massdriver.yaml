name: massdriver-autodeploy-downstream
description: Deploys the dependents of an instance after it deploys. Each rule selects dependents by their attributes.
  The first rule that matches a dependent applies. Runs on a Kubernetes cluster, with an event destination that sends
  it only the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-autodeploy-downstream
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - config
  - attributes
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - host
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served, such as `autodeploy-downstream.automations.acme.com`. Point it
            at the ingress controller. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        class_name:
          type: string
          title: Ingress class
          description: Empty uses the default class of the cluster.
        cluster_issuer:
          type: string
          title: cert-manager ClusterIssuer
          description: Issues a certificate for the host. Leave empty when TLS ends in front of the ingress controller,
            or when you set a TLS secret.
        tls_secret_name:
          type: string
          title: TLS secret
          description: A Secret in the namespace with a certificate for the host. Ignored when a ClusterIssuer is set.
    config:
      type: object
      title: Settings
      properties:
        rules:
          type: array
          title: Rules
          items:
            type: object
            title: Rule
            required:
            - name
            - downstream
            - action
            properties:
              name:
                type: string
                title: Name
                description: Unique. The logs and the deployment message name the rule.
                pattern: ^[a-z0-9][a-z0-9-]*$
                message:
                  pattern: Must be lowercase letters, numbers, and hyphens.
              downstream:
                type: object
                title: Dependent attributes
                description: Attributes that a dependent must have to deploy, such as `autodeploy` = `true`. Separate
                  values with commas to match any of them, such as `api, web`.
                default: {}
                additionalProperties:
                  type: string
              upstream:
                type: object
                title: Upstream attributes
                description: Attributes that the instance that deployed must have. Empty matches every instance. Separate
                  values with commas to match any of them, such as `api, web`.
                default: {}
                additionalProperties:
                  type: string
              action:
                type: string
                title: Action
                oneOf:
                - const: deploy
                  title: Deploy now
                - const: propose
                  title: Propose a deployment for a person to approve
                default: deploy
          minItems: 1
          default:
          - name: autodeploy
            downstream:
              autodeploy: 'true'
            upstream: {}
            action: deploy
        results:
          type: object
          title: Stash results
          properties:
            prefix:
              type: string
              title: Key prefix
              description: The start of the stash keys of the results the automation writes. The server accepts `md/v1`
                keys once its widget catalog has them. Until then, a prefix outside `md/`, such as `results/v1`, shows
                each result as a labeled row.
              default: md/v1
              pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
              message:
                pattern: Must be letters, digits, and `_ . -`, in parts separated by `/`, such as results/v1.
    attributes:
      type: object
      title: Event attributes
      description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends events
        of any attributes.
      default: {}
      additionalProperties:
        type: string
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  kubernetes_cluster:
    resource_type: massdriver-kubernetes-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - config
  - attributes
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - class_name
    - cluster_issuer
    - tls_secret_name
  config:
    rules:
      ui:options:
        itemTitle: '{{name}}'
      items:
        ui:order:
        - name
        - action
        - downstream
        - upstream
        action:
          ui:widget: radio
  attributes:
    ui:options:
      addButtonText: Add attribute
