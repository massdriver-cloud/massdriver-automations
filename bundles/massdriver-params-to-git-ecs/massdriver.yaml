name: massdriver-params-to-git-ecs
description: Writes the params of each successful deployment to `params.json` in a GitHub repository, by push or pull
  request. Set the `GITHUB_TOKEN` secret. Runs on Amazon ECS with Fargate, with an event destination that sends it only
  the events it uses.
source_url: https://github.com/massdriver-cloud/massdriver-automations/tree/main/bundles/massdriver-params-to-git-ecs
version: 0.1.0
steps:
- path: src
  provisioner: opentofu:1.10
params:
  required:
  - image
  - ingress
  - logs
  - config
  - attributes
  properties:
    image:
      type: object
      title: Image
      required:
      - repository
      - tag
      properties:
        repository:
          type: string
          title: Repository
          description: The automations image. bundle-scanner adds `-scanner` to the tag, and router adds `-scripts` when
            it runs commands.
          default: ghcr.io/massdriver-cloud/massdriver-automations
        tag:
          type: string
          title: Tag
          description: The image tag, such as `0.2.0`. Pin a version so that a redeploy runs the same code.
          default: '0.2'
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,100}$
          message:
            pattern: Must be a valid image tag.
    ingress:
      type: object
      title: Ingress
      required:
      - dns_records
      properties:
        host:
          type: string
          title: Host
          description: Where the automation is served. Empty uses `params-to-git.<domain of the cluster's hosted zone>`.
            The load balancer's HTTPS listener needs a certificate for it. Massdriver sends events to `https://<host>/hooks/massdriver`.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          message:
            pattern: Must be a lowercase DNS name, such as drift.automations.acme.com.
        dns_records:
          type: boolean
          title: Create a DNS record
          description: Creates a CNAME record to the load balancer when the host is in the cluster's hosted zone.
          default: true
    logs:
      type: object
      title: Logs
      required:
      - retention_days
      properties:
        retention_days:
          type: integer
          title: Retention (days)
          description: Days that CloudWatch Logs keeps the logs.
          default: 90
          enum:
          - 1
          - 3
          - 5
          - 7
          - 14
          - 30
          - 60
          - 90
          - 120
          - 150
          - 180
          - 365
          - 400
          - 545
          - 731
          - 1096
          - 1827
          - 2192
          - 2557
          - 2922
          - 3288
          - 3653
    config:
      type: object
      title: Settings
      required:
      - defaults
      properties:
        defaults:
          type: object
          title: Defaults
          description: Where instances go when no mapping matches them. Mappings use these for each field they leave empty.
          required:
          - repo
          properties:
            repo:
              type: string
              title: Repository
              description: The repository, as `owner/name`.
              pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
              message:
                pattern: Must be owner/name, such as acme/platform.
            branch:
              type: string
              title: Branch
              description: The branch that holds the files.
              default: main
            root:
              type: string
              title: Root
              description: The directory of the files. `/` is the top of the repository. Below it, each instance writes
                `<project>/<environment>/<component>/params.json`.
              default: /
            strategy:
              type: string
              title: Strategy
              oneOf:
              - const: push
                title: Commit to the branch
              - const: pull_request
                title: Open or update a pull request into the branch
              - const: stdout
                title: Print the file to the logs and write nothing to GitHub
              default: push
            sensitive:
              type: string
              title: Sensitive params
              oneOf:
              - const: mask
                title: Keep the key with a masked value
              - const: omit
                title: Drop the key
              default: mask
            on_decommission:
              type: string
              title: On decommission
              oneOf:
              - const: delete
                title: Delete params.json
              - const: keep
                title: Keep params.json
              default: delete
            skip:
              type: boolean
              title: Skip
              description: Write nothing for these instances.
              default: false
            commit:
              type: object
              title: Commit
              properties:
                author:
                  type: string
                  title: Author
                  oneOf:
                  - const: actor
                    title: The person or service account that deployed
                  - const: bot
                    title: The account of the GitHub token
                  default: actor
                email:
                  type: string
                  title: Author email
                  description: The author's email when the author is the person who deployed. Empty uses noreply@massdriver.cloud.
                message:
                  type: string
                  title: Message
                  description: 'Text with `\(expr)` jq interpolations over the event. Empty uses `<instance>: <action>
                    deployment <id>`.'
            pull_request:
              type: object
              title: Pull request
              properties:
                branch:
                  type: string
                  title: Branch
                  description: Text with `\(expr)`. Empty uses `massdriver/params/<project>-<environment>`.
                title:
                  type: string
                  title: Title
                  description: 'Text with `\(expr)`. Empty uses `Massdriver params: <project>-<environment>`.'
                rolling:
                  type: boolean
                  title: Rolling
                  description: One open pull request that each deployment adds to. Off opens one for each deployment.
                  default: true
                reviewers:
                  type: array
                  title: Reviewers
                  description: Asked to review each new pull request. A login, or `org/team` for a team.
                  items:
                    type: string
                    title: Reviewer
                    pattern: ^[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?$
                    message:
                      pattern: Must be a login, or org/team.
        mappings:
          type: array
          title: Mappings
          description: The first mapping that matches an instance applies.
          items:
            type: object
            title: Mapping
            required:
            - name
            - match
            properties:
              name:
                type: string
                title: Name
                description: Unique. The logs name the mapping.
                pattern: ^[a-z0-9][a-z0-9-]*$
                message:
                  pattern: Must be lowercase letters, numbers, and hyphens.
              match:
                type: object
                title: Attributes
                description: Attributes that the deployment event must have, such as `md-environment` = `prod`. Separate
                  values with commas to match any of them, such as `api, web`.
                default: {}
                additionalProperties:
                  type: string
              repo:
                type: string
                title: Repository
                description: The repository, as `owner/name`. Empty uses the defaults.
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                message:
                  pattern: Must be owner/name, such as acme/platform.
              branch:
                type: string
                title: Branch
                description: The branch that holds the files. Empty uses the defaults.
              root:
                type: string
                title: Root
                description: The directory of the files. `/` is the top of the repository. Below it, each instance writes
                  `<project>/<environment>/<component>/params.json`. Empty uses the defaults.
              strategy:
                type: string
                title: Strategy
                oneOf:
                - const: push
                  title: Commit to the branch
                - const: pull_request
                  title: Open or update a pull request into the branch
                - const: stdout
                  title: Print the file to the logs and write nothing to GitHub
              sensitive:
                type: string
                title: Sensitive params
                oneOf:
                - const: mask
                  title: Keep the key with a masked value
                - const: omit
                  title: Drop the key
              on_decommission:
                type: string
                title: On decommission
                oneOf:
                - const: delete
                  title: Delete params.json
                - const: keep
                  title: Keep params.json
              skip:
                type: boolean
                title: Skip
                description: Write nothing for these instances. Empty uses the defaults.
              commit:
                type: object
                title: Commit
                properties:
                  author:
                    type: string
                    title: Author
                    oneOf:
                    - const: actor
                      title: The person or service account that deployed
                    - const: bot
                      title: The account of the GitHub token
                  email:
                    type: string
                    title: Author email
                    description: The author's email when the author is the person who deployed. Empty uses noreply@massdriver.cloud.
                  message:
                    type: string
                    title: Message
                    description: 'Text with `\(expr)` jq interpolations over the event. Empty uses `<instance>: <action>
                      deployment <id>`.'
              pull_request:
                type: object
                title: Pull request
                properties:
                  branch:
                    type: string
                    title: Branch
                    description: Text with `\(expr)`. Empty uses `massdriver/params/<project>-<environment>`.
                  title:
                    type: string
                    title: Title
                    description: 'Text with `\(expr)`. Empty uses `Massdriver params: <project>-<environment>`.'
                  rolling:
                    type: boolean
                    title: Rolling
                    description: One open pull request that each deployment adds to. Off opens one for each deployment.
                  reviewers:
                    type: array
                    title: Reviewers
                    description: Asked to review each new pull request. A login, or `org/team` for a team.
                    items:
                      type: string
                      title: Reviewer
                      pattern: ^[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?$
                      message:
                        pattern: Must be a login, or org/team.
          default: []
        github:
          type: object
          title: GitHub
          properties:
            api_url:
              type: string
              title: API URL
              description: 'For GitHub Enterprise Server: `https://<host>/api/v3`.'
              default: https://api.github.com
              pattern: ^https?://[^\s]+$
              message:
                pattern: Must be a URL.
    attributes:
      type: object
      title: Event attributes
      description: Attribute values that an event's entity must have, such as `md-environment` = `prod`. Empty sends events
        of any attributes.
      default: {}
      additionalProperties:
        type: string
    otel:
      type: object
      title: Tracing
      description: Sends OpenTelemetry traces to an OTLP endpoint. Set the `OTEL_EXPORTER_OTLP_HEADERS` secret when the
        endpoint needs credentials.
      properties:
        endpoint:
          type: string
          title: OTLP endpoint
          description: The OTLP/HTTP base URL of a collector, such as `http://otel-collector.observability:4318`. Empty
            turns tracing off.
dependencies:
  aws_authentication:
    resource_type: aws-iam-role
    required: true
  ecs_cluster:
    resource_type: aws-ecs-cluster
    required: true
  service_account:
    resource_type: massdriver-service-account
    required: true
resources: {}
app:
  secrets:
    GITHUB_TOKEN:
      title: GitHub token
      description: Needs `Contents` write, and `Pull requests` write for the pull request strategy, or the `repo` scope.
    PARAMS_MASK_KEY:
      title: Mask key
      description: A random key. With it, each masked param is a fingerprint of the secret, so a diff shows that it changed.
    OTEL_EXPORTER_OTLP_HEADERS:
      title: OTLP headers
      description: Headers for the OTLP endpoint, as `key=value` pairs separated by commas, such as `authorization=Bearer
        abc123`.
ui:
  ui:order:
  - image
  - ingress
  - logs
  - config
  - attributes
  - otel
  - '*'
  image:
    ui:order:
    - repository
    - tag
  ingress:
    ui:order:
    - host
    - dns_records
  logs:
    ui:order:
    - retention_days
  config:
    ui:order:
    - defaults
    - mappings
    - github
    defaults:
      ui:order:
      - repo
      - branch
      - root
      - strategy
      - sensitive
      - on_decommission
      - skip
      - commit
      - pull_request
      pull_request:
        reviewers:
          ui:field: tagInput
    mappings:
      ui:options:
        itemTitle: '{{name}}'
      items:
        ui:order:
        - name
        - match
        - repo
        - branch
        - root
        - strategy
        - sensitive
        - on_decommission
        - skip
        - commit
        - pull_request
        pull_request:
          reviewers:
            ui:field: tagInput
  attributes:
    ui:options:
      addButtonText: Add attribute
